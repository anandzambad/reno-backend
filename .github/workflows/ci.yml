name: Reno Backend CI/CD

on:
  push:
    branches: [main, develop, beta, staging]
  pull_request:
    branches: [main, develop, beta, staging]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write
  actions: read

concurrency:
  group: reno-backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'

jobs:
  validate:
    name: Build + Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: reno
          MYSQL_USER: reno
          MYSQL_PASSWORD: reno
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Validate
        run: mvn -B validate
      - name: Compile
        run: mvn -B -DskipTests compile
      - name: Test
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/reno
          DB_USERNAME: reno
          DB_PASSWORD: reno
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: mvn -B test
      - name: Package
        run: mvn -B -DskipTests package
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports-${{ github.sha }}
          path: target/surefire-reports/**
          if-no-files-found: ignore
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: reno-backend-${{ github.sha }}
          path: target/*.jar
          if-no-files-found: error

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - uses: github/codeql-action/init@v3
        with:
          languages: java
      - run: mvn -B -DskipTests package
      - uses: github/codeql-action/analyze@v3

  docker:
    name: Docker Build
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: reno-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish GHCR image
    needs: [validate, codeql, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/reno-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/reno-backend:latest
